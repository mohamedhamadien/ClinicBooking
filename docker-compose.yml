services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: clinicbooking-sqlserver
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"YourStrong@Passw0rd!\" -C -Q \"SELECT 1\" -b -o /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - clinicbooking-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinicbooking-api
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__SqlServer=Server=sqlserver,1433;Database=ClinicBookingDb;User Id=sa;Password=YourStrong@Passw0rd!;TrustServerCertificate=True;MultipleActiveResultSets=True;
      - JwtSettings__SecretKey=SuperSecretClinicBookingJwtKey2026!EnterpriseSecureKeyRequired
      - JwtSettings__Issuer=ClinicBookingAPI
      - JwtSettings__Audience=ClinicBookingClients
      - JwtSettings__ExpiryMinutes=60
      - JwtSettings__RefreshTokenExpiryDays=7
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - clinicbooking-network

  web:
    build:
      context: ./src/ClinicBooking.Web
      dockerfile: Dockerfile
    container_name: clinicbooking-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "4200:80"
    networks:
      - clinicbooking-network

volumes:
  sqlserver_data:
    driver: local

networks:
  clinicbooking-network:
    driver: bridge
